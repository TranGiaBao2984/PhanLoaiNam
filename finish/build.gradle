plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

ext {
    tfliteVersion = "0.4.4"
    tfliteCoreVersion = "2.13.0"\
}

android {
    namespace = "org.tensorflow.lite.examples.classification"
    compileSdk = 36

    defaultConfig {
        applicationId = "org.tensorflow.lite.examples.classification"
        minSdk = 26
        targetSdk = 36
        versionCode = 1
        versionName = "1.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            )
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        mlModelBinding = true
        buildConfig = true
    }

    aaptOptions {
        noCompress "tflite"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // CameraX
    implementation "androidx.camera:camera-core:1.3.1"
    implementation "androidx.camera:camera-camera2:1.3.1"
    implementation "androidx.camera:camera-lifecycle:1.3.1"
    implementation "androidx.camera:camera-view:1.3.1"

    // TensorFlow Lite
    implementation("org.tensorflow:tensorflow-lite-support:$tfliteVersion") {
        exclude group: 'com.google.ai.edge.litert'
    }
    implementation "org.tensorflow:tensorflow-lite:$tfliteCoreVersion"
    implementation "org.tensorflow:tensorflow-lite-gpu:$tfliteCoreVersion"
    implementation("org.tensorflow:tensorflow-lite-metadata:$tfliteVersion") {
        exclude group: 'com.google.ai.edge.litert'
    }

    // GSON
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.google.android.material:material:1.13.0'

    // Firebase BoM (Vẫn giữ Auth, Firestore, Analytics)
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-analytics'
    // implementation 'com.google.firebase:firebase-storage-ktx' // <-- Xóa đi, chúng ta dùng Supabase
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'



    // Supabase (Dùng BOM 3.2.6)
    implementation platform("io.github.jan-tennert.supabase:bom:3.2.6")
    implementation "io.github.jan-tennert.supabase:storage-kt" // Đã bao gồm auth-kt

// Ktor (BOM 3.0.0-beta-2 tương thích với Supabase 3.x)
    implementation platform("io.ktor:ktor-bom:3.0.0-beta-2")

    // ✅ Downgrade browser (Giữ nguyên)
    implementation 'androidx.browser:browser:1.9.0'
    implementation "io.ktor:ktor-client-android:2.3.0"
}